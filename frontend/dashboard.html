<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Smart Contract 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e27;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav {
            display: flex;
            gap: 20px;
        }

        .nav a {
            color: #a0aec0;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav a:hover, .nav a.active {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #a0aec0;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #00ff88;
        }

        .stat-change {
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .stat-change.up { color: #00ff88; }
        .stat-change.down { color: #ff4444; }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 30px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: #a0aec0;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        td {
            color: #fff;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge.buy { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .badge.sell { background: rgba(255, 68, 68, 0.2); color: #ff4444; }
        .badge.pending { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
        .badge.executed { background: rgba(0, 255, 136, 0.2); color: #00ff88; }

        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .symbol-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .symbol-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #a0aec0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .symbol-btn.active {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard</h1>
            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="dashboard.html" class="active">Dashboard</a>
            </nav>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Contracts</div>
                <div class="stat-value" id="totalContracts">0</div>
                <div class="stat-change up">+12% this week</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Trades</div>
                <div class="stat-value" id="activeTrades">0</div>
                <div class="stat-change up">3 pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Volume</div>
                <div class="stat-value" id="totalVolume">$0</div>
                <div class="stat-change up">+8.5%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Success Rate</div>
                <div class="stat-value" id="successRate">0%</div>
                <div class="stat-change up">+2.3%</div>
            </div>
        </div>

        <!-- Price Chart -->
        <div class="glass-card">
            <h2 style="margin-bottom: 20px;">📈 Price Chart</h2>
            <div class="symbol-selector">
                <button class="symbol-btn active" onclick="changeSymbol('BTC')">BTC</button>
                <button class="symbol-btn" onclick="changeSymbol('ETH')">ETH</button>
                <button class="symbol-btn" onclick="changeSymbol('SOL')">SOL</button>
                <button class="symbol-btn" onclick="changeSymbol('BNB')">BNB</button>
            </div>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </div>

        <!-- Transaction History -->
        <div class="glass-card">
            <h2 style="margin-bottom: 20px;">📋 Transaction History</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Contract ID</th>
                            <th>Symbol</th>
                            <th>Action</th>
                            <th>Entry Price</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTable">
                        <tr>
                            <td colspan="7" style="text-align: center; color: #a0aec0;">No transactions yet</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let currentSymbol = 'BTC';
        let priceChart = null;

        // Initialize chart
        function initChart() {
            const ctx = document.getElementById('priceChart').getContext('2d');
            priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Price (USD)',
                        data: [],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            ticks: { color: '#a0aec0' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#a0aec0' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    }
                }
            });
        }

        // Load price history
        async function loadPriceHistory(symbol) {
            try {
                // Mock data for demo
                const labels = [];
                const data = [];
                const basePrice = Math.random() * 50000 + 20000;
                
                for (let i = 24; i >= 0; i--) {
                    const date = new Date(Date.now() - i * 3600000);
                    labels.push(date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }));
                    data.push((basePrice + (Math.random() - 0.5) * 2000).toFixed(2));
                }

                priceChart.data.labels = labels;
                priceChart.data.datasets[0].data = data;
                priceChart.update();
            } catch (error) {
                console.error('Error loading price history:', error);
            }
        }

        // Change symbol
        function changeSymbol(symbol) {
            currentSymbol = symbol;
            
            // Update active button
            document.querySelectorAll('.symbol-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === symbol) {
                    btn.classList.add('active');
                }
            });

            loadPriceHistory(symbol);
        }

        // Load transactions
        async function loadTransactions() {
            try {
                // Mock data for demo
                const transactions = [
                    { id: 1001, symbol: 'BTC', action: 'BUY', price: 45230.50, amount: 100, status: 'EXECUTED', date: new Date() },
                    { id: 1002, symbol: 'ETH', action: 'SELL', price: 2890.25, amount: 200, status: 'EXECUTED', date: new Date(Date.now() - 3600000) },
                    { id: 1003, symbol: 'SOL', action: 'BUY', price: 98.50, amount: 150, status: 'PENDING', date: new Date(Date.now() - 7200000) }
                ];

                const tbody = document.getElementById('transactionTable');
                tbody.innerHTML = transactions.map(tx => `
                    <tr>
                        <td>#${tx.id}</td>
                        <td>${tx.symbol}</td>
                        <td><span class="badge ${tx.action.toLowerCase()}">${tx.action}</span></td>
                        <td>$${tx.price.toFixed(2)}</td>
                        <td>$${tx.amount}</td>
                        <td><span class="badge ${tx.status.toLowerCase()}">${tx.status}</span></td>
                        <td>${tx.date.toLocaleString()}</td>
                    </tr>
                `).join('');

                // Update stats
                document.getElementById('totalContracts').textContent = transactions.length;
                document.getElementById('activeTrades').textContent = transactions.filter(t => t.status === 'PENDING').length;
                document.getElementById('totalVolume').textContent = '$' + transactions.reduce((sum, t) => sum + t.amount, 0).toLocaleString();
                document.getElementById('successRate').textContent = '87%';
            } catch (error) {
                console.error('Error loading transactions:', error);
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            initChart();
            loadPriceHistory(currentSymbol);
            loadTransactions();
        });
    </script>
</body>
</html>
